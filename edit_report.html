<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Report</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div class="logo">♻️ Waste Management</div>
    <nav>
        <a href="/">Home</a>
        <a href="/reports">Reports</a>
        <a href="/analytics">Analytics</a>
    </nav>
</header>

<main class="form-section">
    <div class="form-container wide-form">
        <h1>Edit Waste Report</h1>

        <form method="POST" action="/edit-report">
            <input type="hidden" name="report_id" value="{{REPORT_ID}}">

            <label for="location">Location</label>
            <input type="text" id="location" name="location"
                   value="{{LOCATION}}" required>

            <label for="category">Waste Category</label>
            <select id="category" name="category" required>
                {{CATEGORY_OPTIONS}}
            </select>

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      rows="6" required>{{DESCRIPTION}}</textarea>

            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                {{PRIORITY_OPTIONS}}
            </select>

            <label for="status">Status</label>
            <select id="status" name="status" required>
                {{STATUS_OPTIONS}}
            </select>

            <button class="primary-button full-button" type="submit">
                Save Changes
            </button>
        </form>
    </div>
</main>

<script src="/static/script.js"></script>
</body>
</html>
