<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <div class="logo">♻️ Waste Management</div>
    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </nav>
</header>

<main class="form-section">
    <div class="form-container">
        <h1>Forgot Password</h1>
        <p>Enter your email and create a new password.</p>

        <form method="POST" action="/forgot-password">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your registered email" required>

            <label for="new_password">New Password</label>
            <div class="password-box">
                <input type="password" id="new_password" name="new_password"
                       placeholder="Enter your new password" required>
                <button type="button" onclick="togglePassword('new_password', this)">👁️</button>
            </div>

            <button class="primary-button full-button" type="submit">
                Reset Password
            </button>
        </form>
    </div>
</main>

<script src="/static/script.js"></script>
</body>
</html>
